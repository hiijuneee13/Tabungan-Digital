<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Detail Tabungan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="../css/tabungan.css">
</head>
<body class="min-h-screen font-inter bg-gradient-to-br from-[#081028] via-[#0c1726] to-[#0f2033] text-slate-100">

<div id="pageWrap" class="min-h-screen">
<div class="max-w-3xl mx-auto p-6">
  <a href="../index.html" class="inline-flex items-center gap-2 text-slate-300 mb-4">← Kembali ke Dashboard</a>
  <div id="detailWrap" class="bg-white/3 border border-white/5 rounded-2xl p-6" data-aos="fade-up">
    <div id="detailContent" class="space-y-4">Memuat...</div>
  </div>
</div>
</div>

<input id="detailImageInput" type="file" accept="image/*" class="hidden">

<div id="deleteModalDetail" class="fixed inset-0 hidden z-50 items-center justify-center">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div class="relative bg-[#071027] border border-white/6 rounded-xl p-6 w-full max-w-md mx-4">
    <h3 class="text-lg font-semibold mb-2">Konfirmasi Hapus</h3>
    <p class="text-sm text-slate-300 mb-4">Yakin ingin menghapus tujuan ini?</p>
    <div class="flex justify-end gap-3">
      <button id="detailModalCancel" class="px-4 py-2 rounded-md bg-white/6">Batal</button>
      <button id="detailModalConfirm" class="px-4 py-2 rounded-md bg-red-600">Hapus</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="../js/components/storage.js"></script>
<script src="../js/components/animation.js"></script>
<script src="../js/detail-tabungan.js"></script>
</body>
</html>
