<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tabungan Digital — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="css/tabungan.css">
  <link rel="stylesheet" href="css/components/card.css">
</head>
<body class="min-h-screen font-inter bg-gradient-to-br from-[#081028] via-[#0c1726] to-[#0f2033] text-slate-100">

<div id="pageWrap" class="min-h-screen">

<header class="sticky top-0 z-40 backdrop-blur bg-black/30 border-b border-white/5">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <div class="logoBox" title="Tabungan Digital">
        <div class="logoInner">TD</div>
      </div>
      <div>
        <h1 class="text-lg font-poppins">Tabungan Digital</h1>
        <p class="text-sm text-slate-400 tagline">Catatan tabungan pribadi — fokus tiap tujuan</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <a id="btnTambah" href="html/tambah-tabungan.html" class="btn-primary inline-flex items-center gap-2 px-4 py-2 rounded-lg shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Tambah
      </a>
      <button id="refreshBtn" class="p-2 rounded-lg bg-white/5 hover:bg-white/7 transition" title="Refresh">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v6h6M20 20v-6h-6M20 8V4h-4M4 16v4h4" />
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-10">
  <section class="mb-6">
    <div class="bg-white/3 border border-white/5 rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <p class="text-sm text-slate-300">Selamat datang</p>
        <h2 class="text-2xl font-poppins font-semibold mt-1">Daftar Tujuan</h2>
      </div>
    </div>
  </section>

  <section>
    <div id="tabunganList" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="emptyState" class="mt-12 text-center text-slate-400 hidden">
      <p class="mb-4">Belum ada tujuan tabungan.</p>
    </div>
  </section>
</main>

<footer class="max-w-5xl mx-auto px-6 pb-8 text-sm text-slate-500">
  <p></p>
</footer>
</div>

<!-- Delete confirmation modal (dark blur) -->
<div id="deleteModal" class="fixed inset-0 hidden z-50 items-center justify-center">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div class="relative bg-[#071027] border border-white/6 rounded-xl p-6 w-full max-w-md mx-4">
    <h3 class="text-lg font-semibold mb-2">Konfirmasi Hapus</h3>
    <p class="text-sm text-slate-300 mb-4">Yakin ingin menghapus tujuan ini? Tindakan ini tidak bisa dibatalkan.</p>
    <div class="flex justify-end gap-3">
      <button id="modalCancel" class="px-4 py-2 rounded-md bg-white/6">Batal</button>
      <button id="modalConfirm" class="px-4 py-2 rounded-md bg-red-600">Hapus</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script src="js/data/dummy-data.js"></script>
<script src="js/components/storage.js"></script>
<script src="js/components/animation.js"></script>
<script src="js/tabungan.js"></script>
</body>
</html>
